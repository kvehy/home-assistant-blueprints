blueprint:
  name: Motion Auto Light
  description: Automaticky rozsvítit a zhasnout v závislosti na pohybu s podmínkou a sekvencemi
  domain: automation
  author: Kvehy
  input:
    motion_sensor:
      name: Motion Sensor
      description: Select the motion sensor entity
      selector:
        entity:
          domain: binary_sensor
          device_class: occupancy

    occupancy_sequence:
      name: Sequence for Occupancy
      description: Define a sequence to be executed when motion is detected
      default: []
      selector:
        action: {}

    no_occupancy_sequence:
      name: Sequence for No Occupancy
      description: Define a sequence to be executed when no motion is detected
      default: []
      selector:
        action: {}

    delay_after_occupancy:
      name: Delay after Occupancy Action (Seconds)
      description: Delay before turning off the lights after running the occupancy sequence
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: slider
          step: 1

    custom_condition:
      name: Custom Conditiona (optional)
      description: A condition that must be met to trigger the sequence
      default: []
      selector:
        condition: {}

mode: restart

trigger:
  - platform: state
    entity_id: !input motion_sensor
    to: "on"
    id: OCCUPANCY
  - platform: state
    entity_id: !input motion_sensor
    to: "off"
    id: NO_OCCUPANCY
    for:
      hours: 0
      minutes: 0
      seconds: !input delay_after_occupancy

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: OCCUPANCY
          - condition: and
            conditions: !input custom_condition
        sequence: !input occupancy_sequence
      - conditions:
          - condition: trigger
            id: NO_OCCUPANCY
          - condition: and
            conditions: !input custom_condition
        sequence: !input no_occupancy_sequence
